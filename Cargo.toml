[package]
name = "cc3-egui"
version = "1.0.0"
edition = "2021"
description = "CC3 native Rust egui desktop app"
authors = ["Areo-RGB <paziske@gmail.com>"]
license = "MIT"

[workspace]
resolver = "2"

[dependencies]
eframe = "0.31"
egui_extras = "0.31"
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
